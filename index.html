<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Orb Collector 3000</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a0a2e; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

        /* HUD panels */
        .hud-top { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; }

        .stat-card {
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px 18px;
            color: #fff;
            text-align: center;
            backdrop-filter: blur(6px);
            min-width: 80px;
        }
        .stat-label { font-size: 10px; letter-spacing: 2px; opacity: 0.6; text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: 700; }
        #score-val { color: #ffdd44; }
        #health-val { color: #ff6666; }

        .health-bar-wrap {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; overflow: hidden;
            margin-top: 4px;
        }
        #health-bar { height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); border-radius: 3px; width: 100%; transition: width 0.3s; }

        /* Power-up status */
        .powerup-card {
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px 18px;
            color: #fff;
            text-align: center;
            backdrop-filter: blur(6px);
            min-width: 80px;
        }
        #powerup-label { font-size: 10px; letter-spacing: 2px; opacity: 0.6; text-transform: uppercase; }
        #powerup-bar-wrap {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px; overflow: hidden; margin-top: 4px;
        }
        #powerup-bar { height: 100%; border-radius: 3px; transition: width 0.1s linear; }

        /* Title screen */
        #title-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a3e 50%, #0a1a2e 100%);
            z-index: 100; pointer-events: all; cursor: pointer;
        }
        #title-screen h1 {
            font-size: 64px; font-weight: 900; color: #fff;
            text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc44;
            letter-spacing: -1px; margin-bottom: 10px;
        }
        #title-screen .subtitle {
            font-size: 16px; color: rgba(255,255,255,0.5); letter-spacing: 4px; margin-bottom: 50px;
        }
        .click-hint {
            font-size: 18px; color: rgba(255,255,255,0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

        .controls-hint {
            position: absolute; bottom: 30px;
            font-size: 12px; color: rgba(255,255,255,0.3);
            display: flex; gap: 20px;
        }
        .controls-hint span { background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; }

        /* Wave banner */
        #wave-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; font-weight: 900; color: #fff;
            text-shadow: 0 0 20px #00ffcc, 0 4px 20px rgba(0,0,0,0.8);
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Orb collect flash */
        #collect-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,220,60,0.3) 0%, transparent 70%);
            opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }

        /* Damage flash */
        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,0,0,0.35);
            opacity: 0; pointer-events: none;
        }

        /* Game over */
        #gameover-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); z-index: 100; pointer-events: all; cursor: pointer;
        }
        #gameover-screen h2 { font-size: 56px; color: #ff4444; text-shadow: 0 0 30px #ff000066; margin-bottom: 20px; }
        #gameover-screen .final-score { font-size: 28px; color: #ffdd44; margin-bottom: 40px; }
        #gameover-screen .restart-hint { font-size: 16px; color: rgba(255,255,255,0.5); animation: pulse 2s infinite; }

        /* Kill feed */
        #kill-feed { position: absolute; top: 80px; right: 20px; text-align: right; }
        .kill-entry {
            font-size: 12px; color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px;
            margin-bottom: 4px; animation: feedIn 0.3s ease;
        }
        @keyframes feedIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="title-screen">
        <h1>⚡ ORB COLLECTOR</h1>
        <div class="subtitle">GEOMETRIC PURSUIT</div>
        <div class="click-hint">Click to Play</div>
        <div class="controls-hint">
            <span>WASD — Move</span>
            <span>Mouse — Camera</span>
            <span>Click — Dash</span>
        </div>
    </div>

    <div id="gameover-screen">
        <h2>GAME OVER</h2>
        <div class="final-score">Score: <span id="final-score-val">0</span></div>
        <div class="restart-hint">Click to Restart</div>
    </div>

    <div id="hud">
        <div class="hud-top">
            <div class="stat-card">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score-val">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Health</div>
                <div class="stat-value" id="health-val">3</div>
                <div class="health-bar-wrap"><div id="health-bar"></div></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Wave</div>
                <div class="stat-value" id="wave-val" style="color:#00ffcc">1</div>
            </div>
            <div class="stat-card" id="powerup-card" style="display:none;">
                <div class="stat-label" id="powerup-label">POWER</div>
                <div class="stat-value" id="powerup-val" style="font-size:16px;color:#44ffcc">—</div>
                <div id="powerup-bar-wrap"><div id="powerup-bar" style="width:0%;background:#44ffcc"></div></div>
            </div>
        </div>
        <div id="wave-banner"></div>
        <div id="collect-flash"></div>
        <div id="damage-flash"></div>
        <div id="kill-feed"></div>
    </div>

    <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

    // ─── CONSTANTS ───────────────────────────────────────────────────────────
    const C = {
        ARENA: 40,
        PLAYER_SPEED: 10,
        DASH_SPEED: 22,
        DASH_DURATION: 0.25,
        DASH_COOLDOWN: 1.5,
        ORB_COUNT: 12,
        ORB_SCORE: 10,
        ENEMY_BASE_SPEED: 3.5,
        ENEMY_SPEED_INC: 0.3,
        PLAYER_HEALTH: 3,
        INVINCIBLE_TIME: 1.5,
        WAVE_DURATION: 20,
        // Power-up types
        PU_TYPES: ['speed','shield','freeze','bomb'],
        PU_SPEED_DUR: 6,
        PU_SHIELD_DUR: 5,
        PU_FREEZE_DUR: 5,
    };

    // ─── STATE ───────────────────────────────────────────────────────────────
    const state = {
        mode: 'title',
        score: 0,
        health: C.PLAYER_HEALTH,
        wave: 1,
        waveTimer: 0,
        invincibleTimer: 0,
        dashCooldown: 0,
        isDashing: false,
        dashTimer: 0,
        screenShake: 0,
        time: 0,
        // Power-up state
        powerup: null,
        powerupTimer: 0,
        enemiesFrozen: false,
        freezeTimer: 0,
        // Boss state
        bossActive: false,
        boss: null,
        bossHealth: 0,
        bossMaxHealth: 0,
        bossTimer: 0,
        // BOSS_WAVE marks every 5th wave
        BOSS_WAVE: 5,
    };

    // ─── RENDERER ────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0a3e, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

    // ─── POST-PROCESSING ──────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.75
    );
    composer.addPass(bloomPass);

    const colorGradingPass = new ShaderPass({
        uniforms: {
            tDiffuse: { value: null },
            brightness: { value: 0.02 },
            contrast: { value: 1.12 },
            saturation: { value: 1.2 },
            vignetteIntensity: { value: 0.25 },
            vignetteRoundness: { value: 0.8 }
        },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `
            uniform sampler2D tDiffuse; uniform float brightness, contrast, saturation;
            uniform float vignetteIntensity, vignetteRoundness; varying vec2 vUv;
            void main() {
                vec4 color = texture2D(tDiffuse, vUv);
                color.rgb += brightness;
                color.rgb = (color.rgb - 0.5) * contrast + 0.5;
                float gray = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                color.rgb = mix(vec3(gray), color.rgb, saturation);
                vec2 uv = vUv * 2.0 - 1.0;
                float vig = 1.0 - dot(uv * vignetteRoundness, uv * vignetteRoundness);
                color.rgb *= mix(1.0 - vignetteIntensity, 1.0, clamp(pow(vig, 1.5), 0.0, 1.0));
                gl_FragColor = color;
            }
        `
    });
    composer.addPass(colorGradingPass);

    const fxaaPass = new ShaderPass(FXAAShader);
    fxaaPass.uniforms['resolution'].value.set(1/window.innerWidth, 1/window.innerHeight);
    composer.addPass(fxaaPass);

    // ─── LIGHTING ────────────────────────────────────────────────────────────
    const sunLight = new THREE.DirectionalLight(0xfff4e6, 2.5);
    sunLight.position.set(30, 50, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -60;
    sunLight.shadow.camera.right = sunLight.shadow.camera.top = 60;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.bias = -0.0005;
    sunLight.shadow.normalBias = 0.02;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0x6699cc, 0.7);
    fillLight.position.set(-25, 15, -15);
    scene.add(fillLight);

    const hemiLight = new THREE.HemisphereLight(0x5533aa, 0x1a0a2e, 0.6);
    scene.add(hemiLight);

    const ambientLight = new THREE.AmbientLight(0x221133, 0.5);
    scene.add(ambientLight);

    // Colored accent lights
    const accentPink = new THREE.PointLight(0xff44aa, 1.5, 30);
    accentPink.position.set(-15, 8, -15);
    scene.add(accentPink);

    const accentBlue = new THREE.PointLight(0x44aaff, 1.5, 30);
    accentBlue.position.set(15, 8, 15);
    scene.add(accentBlue);

    // ─── SKY DOME ────────────────────────────────────────────────────────────
    const skyGeo = new THREE.SphereGeometry(300, 32, 32);
    const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false,
        uniforms: {
            topColor: { value: new THREE.Color(0x0a0520) },
            bottomColor: { value: new THREE.Color(0x2a1a5e) },
            midColor: { value: new THREE.Color(0x5533aa) },
        },
        vertexShader: `
            varying vec3 vWP;
            void main() { vWP = (modelMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
        `,
        fragmentShader: `
            uniform vec3 topColor, bottomColor, midColor; varying vec3 vWP;
            void main() {
                vec3 d = normalize(vWP);
                float h = d.y * 0.5 + 0.5;
                vec3 sky = mix(bottomColor, mix(midColor, topColor, h), smoothstep(0.3, 0.7, h));
                gl_FragColor = vec4(sky, 1.0);
            }
        `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // ─── GROUND ──────────────────────────────────────────────────────────────
    function createGround() {
        const geo = new THREE.PlaneGeometry(C.ARENA * 2, C.ARENA * 2, 80, 80);
        geo.rotateX(-Math.PI / 2);
        const posAttr = geo.attributes.position;
        const colors = new Float32Array(posAttr.count * 3);
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i), z = posAttr.getZ(i);
            const n = (Math.sin(x * 0.12) * Math.cos(z * 0.09) + 1) * 0.5;
            const c = new THREE.Color().setHSL(0.75 + n * 0.05, 0.4, 0.12 + n * 0.08);
            colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0.05 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.receiveShadow = true;
        return mesh;
    }

    // Grid overlay
    function createGrid() {
        const gridHelper = new THREE.GridHelper(C.ARENA * 2, 30, 0x6633cc, 0x331166);
        gridHelper.position.y = 0.02;
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        return gridHelper;
    }

    // ─── ARENA BOUNDARY ───────────────────────────────────────────────────────
    function createBoundary() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x6633cc, emissive: 0x3311aa, emissiveIntensity: 0.5, transparent: true, opacity: 0.4 });
        const wallH = 4;
        const half = C.ARENA;
        [
            { s: [half*2, wallH, 0.3], p: [0, wallH/2, -half] },
            { s: [half*2, wallH, 0.3], p: [0, wallH/2, half] },
            { s: [0.3, wallH, half*2], p: [-half, wallH/2, 0] },
            { s: [0.3, wallH, half*2], p: [half, wallH/2, 0] },
        ].forEach(({ s, p }) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(...s), mat);
            m.position.set(...p);
            m.receiveShadow = true;
            group.add(m);
        });
        return group;
    }

    // Corner pillars
    function createPillars() {
        const group = new THREE.Group();
        const corners = [[-1,-1],[1,-1],[-1,1],[1,1]];
        corners.forEach(([cx, cz]) => {
            const pillar = new THREE.Group();
            pillar.position.set(cx * C.ARENA, 0, cz * C.ARENA);
            // Base
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x220044, roughness: 0.7 });
            const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 0.5, 8), baseMat);
            base.position.y = 0.25; pillar.add(base);
            // Column
            const colMat = new THREE.MeshStandardMaterial({ color: 0x331166, emissive: 0x5533ff, emissiveIntensity: 0.4, metalness: 0.3, roughness: 0.3 });
            const col = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 6, 8), colMat);
            col.position.y = 3.5; col.castShadow = true; pillar.add(col);
            // Orb top
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2, transparent: true, opacity: 0.9 });
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), orbMat);
            orb.position.y = 7; pillar.add(orb);
            group.add(pillar);
        });
        return group;
    }

    // ─── PLAYER MODEL ────────────────────────────────────────────────────────
    function createPlayer() {
        const group = new THREE.Group();

        // Body (boxy)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4466ff, metalness: 0.4, roughness: 0.3, emissive: 0x112244, emissiveIntensity: 0.3 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 0.8), bodyMat);
        body.position.y = 1.6; body.castShadow = true; group.add(body);

        // Head (sphere)
        const headMat = new THREE.MeshStandardMaterial({ color: 0x5588ff, metalness: 0.5, roughness: 0.2, emissive: 0x2244aa, emissiveIntensity: 0.4 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), headMat);
        head.position.y = 2.6; head.castShadow = true; group.add(head);

        // Eyes
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });
        [-0.2, 0.2].forEach(ex => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
            eye.position.set(ex, 2.65, 0.4); group.add(eye);
        });

        // Legs
        const legMat = new THREE.MeshStandardMaterial({ color: 0x3344cc, metalness: 0.3, roughness: 0.5 });
        [-0.28, 0.28].forEach(lx => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.0, 6), legMat);
            leg.position.set(lx, 0.5, 0); leg.castShadow = true; group.add(leg);
        });

        // Antenna
        const antMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x4488ff, emissiveIntensity: 1.5 });
        const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6), antMat);
        ant.position.y = 3.15; group.add(ant);
        const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 3 }));
        antTip.position.y = 3.45; group.add(antTip);

        return group;
    }

    // ─── POWER-UP ORB FACTORY ───────────────────────────────────────────────
    const PU_COLORS = {
        speed:   { hex: 0x44aaff, emissive: 0x44aaff, label: 'SPEED',    color: '#44aaff', sound: [660, 880] },
        shield:  { hex: 0x44ff88, emissive: 0x44ff88, label: 'SHIELD',   color: '#44ff88', sound: [440, 550, 660] },
        freeze:  { hex: 0x88aaff, emissive: 0x88aaff, label: 'FREEZE',   color: '#88aaff', sound: [220, 330, 440] },
        bomb:    { hex: 0xff4444, emissive: 0xff4444, label: 'BOMB',     color: '#ff4444', sound: [110, 80, 55] },
    };

    function createPowerupOrb(type, pos) {
        const cfg = PU_COLORS[type];
        const group = new THREE.Group();

        // Outer rotating ring
        const ringMat = new THREE.MeshStandardMaterial({ color: cfg.hex, emissive: cfg.emissive, emissiveIntensity: 2.5, transparent: true, opacity: 0.7, wireframe: true });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.08, 8, 24), ringMat);
        ring.rotation.x = Math.PI / 2;
        group.add(ring);
        group._ring = ring;

        // Inner core
        const coreMat = new THREE.MeshStandardMaterial({ color: cfg.hex, emissive: cfg.emissive, emissiveIntensity: 3 });
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), coreMat);
        group.add(core);
        group._core = core;

        // Star accent (4-pointed)
        const starMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: cfg.emissive, emissiveIntensity: 4, transparent: true, opacity: 0.9 });
        const starGeo = new THREE.OctahedronGeometry(0.2, 0);
        const star = new THREE.Mesh(starGeo, starMat);
        group.add(star);
        group._star = star;

        group.position.copy(pos);
        group._bobOffset = Math.random() * Math.PI * 2;
        group._type = type;
        group._color = cfg.hex;

        scene.add(group);
        return group;
    }

    function maybeSpawnPowerup(originPos) {
        if (Math.random() > 0.12) return null;
        const types = C.PU_TYPES;
        const type = types[Math.floor(Math.random() * types.length)];
        const offset = new THREE.Vector3((Math.random()-0.5)*4, 0, (Math.random()-0.5)*4);
        const orb = createPowerupOrb(type, originPos.clone().add(offset));
        activeOrbs.push(orb);
        return orb;
    }

    function activatePowerup(type) {
        const cfg = PU_COLORS[type];
        const dur = type === 'speed' ? C.PU_SPEED_DUR
            : type === 'shield' ? C.PU_SHIELD_DUR
            : type === 'freeze' ? C.PU_FREEZE_DUR
            : 0;

        state.powerup = type;
        state.powerupTimer = dur;

        const labelEl = document.getElementById('powerup-label');
        const valEl = document.getElementById('powerup-val');
        const card = document.getElementById('powerup-card');
        const bar = document.getElementById('powerup-bar');

        card.style.display = 'block';
        labelEl.textContent = cfg.label;
        valEl.textContent = cfg.label;
        valEl.style.color = cfg.color;
        bar.style.background = cfg.color;
        bar.style.width = '100%';

        // Sound
        const sounds = cfg.sound;
        sounds.forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.3), i * 80));

        // Type-specific effects
        if (type === 'freeze') {
            state.enemiesFrozen = true;
            state.freezeTimer = dur;
            // Tint enemies blue
            enemies.forEach(e => { e.traverse(c => { if (c.isMesh && c.material) { c.material.emissive?.set(0x4488ff); c.material.emissiveIntensity = 1.5; }}); });
        }
        if (type === 'bomb') {
            // Kill all enemies!
            const killCount = enemies.length;
            enemies.forEach(e => {
                emitParticles(damageParticles, e.position, 40, 8, 0xff4444);
                scene.remove(e);

            enemies.length = 0;
            state.score += killCount * 50;

            addKillFeed(`💥 BOMB! ${killCount} enemies destroyed!`);
            spawnDamageNumber(player.position, `+${killCount*50}`, '#ff4444');
            updateHUD();
        }
        if (type === 'shield') {
            // Instant invincibility + visual
            state.invincibleTimer = Math.max(state.invincibleTimer, dur);
            // Blue shield aura on player
            player.traverse(c => { if (c.isMesh && c.material) { c.material.emissive?.set(0x44ff88); c.material.emissiveIntensity = 0.5; }});

        if (type === 'speed') {
            // Speed boost handled in updatePlayer
        }

    function updatePowerups(delta) {
        if (state.powerup && state.powerupTimer > 0) {
            state.powerupTimer -= delta;
            const bar = document.getElementById('powerup-bar');
            const dur = state.powerup === 'speed' ? C.PU_SPEED_DUR
                : state.powerup === 'shield' ? C.PU_SHIELD_DUR
                : state.powerup === 'freeze' ? C.PU_FREEZE_DUR : 1;
            bar.style.width = Math.max(0, state.powerupTimer / dur * 100) + '%';
            if (state.powerupTimer <= 0) {
                deactivatePowerup();
            }

                state.enemiesFrozen = false;

    function createBoss() {
        const group = new THREE.Group();

        // Main body — big icosahedron
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, emissive: 0xcc0000, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.2 });
        const body = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 1), bodyMat);
        body.castShadow = true;
        group.add(body);

        // Inner glow sphere
        const glowMat = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff4400, emissiveIntensity: 3, transparent: true, opacity: 0.6 });
        const glow = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 16), glowMat);
        group.add(glow);

        // Evil eyes
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 4 });
        [-0.6, 0.6].forEach(ex => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), eyeMat);
            eye.position.set(ex, 0.5, 2.0); group.add(eye);
            // Pupil
            const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x000000 }));
            pupil.position.set(ex, 0.5, 2.25); group.add(pupil);
        });

        // Rotating ring of spikes
        const spikeMat = new THREE.MeshStandardMaterial({ color: 0x880000, emissive: 0x880000, emissiveIntensity: 1 });
        for (let s = 0; s < 8; s++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.2, 5), spikeMat);
            const a = (s / 8) * Math.PI * 2;
            spike.position.set(Math.cos(a) * 2.8, 0, Math.sin(a) * 2.8);
            spike.rotation.z = Math.PI / 2;
            spike.rotation.y = a;
            group.add(spike);
        }

        group.position.set(0, 3, -20);
        group._body = body; group._glow = glow;
        scene.add(group);

        // Point light for boss aura
        const bossLight = new THREE.PointLight(0xff0000, 3, 25);
        bossLight.position.set(0, 3, -20);
        scene.add(bossLight);
        group._light = bossLight;

        return group;
    }

    function spawnBoss() {
        if (state.boss) {
            scene.remove(state.boss);
            scene.remove(state.boss._light);
        }
        state.boss = createBoss();
        state.bossActive = true;
        state.bossHealth = 20;
        state.bossMaxHealth = 20;
        state.bossTimer = 0;
        if (!bossHealthBar) bossHealthBar = createBossHealthBar();

    function updateBoss(delta) {
        if (!state.boss || !state.bossActive) return;
        const boss = state.boss;

        // Float and rotate
        boss._body.rotation.x += delta * 0.5;
        boss._body.rotation.y += delta * 0.7;
        boss._glow.rotation.y -= delta * 1.5;
        boss.position.y = 3 + Math.sin(state.time * 1.5) * 0.5;

        // Slowly drift toward player
        const toPlayer = player.position.clone().sub(boss.position);
        toPlayer.y = 0;
        boss.position.addScaledVector(toPlayer.normalize(), 1.5 * delta);
        boss._light.position.copy(boss.position);

        // Update health bar
        const pct = Math.max(0, state.bossHealth / state.bossMaxHealth * 100);
        document.getElementById('boss-hp-bar').style.width = pct + '%';

        // Collision with player
        if (player.position.distanceTo(boss.position) < 3.5 && state.invincibleTimer <= 0) {
            state.health--;
            state.invincibleTimer = C.INVINCIBLE_TIME;
            emitParticles(damageParticles, player.position, 30, 6, 0xff4444);
            flashDamage();
            addShake(0.6);
            playDamage();
            spawnDamageNumber(player.position, '-1', '#ff4444');
            updateHUD();
            if (state.health <= 0) gameOver();
        }
    }

        updateHUD();
        playWave();
    }

    // ─── PARTICLE SYSTEM ──────────────────────────────────────────────────────
    function createParticles(count = 200, color = 0xffdd44) {
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const velocities = new Float32Array(count * 3);
        const ages = new Float32Array(count).fill(-1);
        const maxAges = new Float32Array(count);
        const sizes = new Float32Array(count);
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const mat = new THREE.PointsMaterial({
            color, size: 0.2, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const pts = new THREE.Points(geo, mat);
        pts.userData = { velocities, ages, maxAges, sizes, count };
        scene.add(pts);
        return pts;
    }

    function emitParticles(system, origin, count = 20, speed = 6, color = 0xffdd44) {
        const pos = system.geometry.attributes.position.array;
        const { velocities, ages, maxAges, sizes } = system.userData;
        let emitted = 0;
        for (let i = 0; i < system.userData.count && emitted < count; i++) {
            if (ages[i] < 0) {
                const i3 = i * 3;
                pos[i3] = origin.x; pos[i3+1] = origin.y; pos[i3+2] = origin.z;
                velocities[i3]   = (Math.random() - 0.5) * speed;
                velocities[i3+1] = Math.random() * speed + 2;
                velocities[i3+2] = (Math.random() - 0.5) * speed;
                ages[i] = 0;
                maxAges[i] = 0.6 + Math.random() * 0.6;
                sizes[i] = 0.3 + Math.random() * 0.4;
                emitted++;
            }
        }
        system.geometry.attributes.position.needsUpdate = true;
    }

    function updateParticles(system, delta) {
        const pos = system.geometry.attributes.position.array;
        const { velocities, ages, maxAges } = system.userData;
        for (let i = 0; i < system.userData.count; i++) {
            if (ages[i] >= 0) {
                ages[i] += delta;
                if (ages[i] >= maxAges[i]) { ages[i] = -1; pos[i*3+1] = -9999; continue; }
                const i3 = i * 3;
                pos[i3]   += velocities[i3]   * delta;
                pos[i3+1] += velocities[i3+1] * delta;
                pos[i3+2] += velocities[i3+2] * delta;
                velocities[i3+1] -= 12 * delta;
            }
        }
        system.geometry.attributes.position.needsUpdate = true;
    }

    // ─── AUDIO ────────────────────────────────────────────────────────────────
    let audioCtx = null;
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, duration = 0.15, type = 'sine', gain = 0.3) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.connect(g); g.connect(audioCtx.destination);
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gain, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function playCollect() { playTone(880, 0.1, 'sine', 0.25); setTimeout(() => playTone(1320, 0.15, 'sine', 0.2), 80); }

    function playDamage() { playTone(150, 0.2, 'sawtooth', 0.3); playTone(100, 0.3, 'square', 0.15); }
    function playWave() { [440, 550, 660, 880].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.25), i * 100)); }
    function playGameOver() { [440, 330, 220, 110].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'sawtooth', 0.2), i * 150)); }
    function playBoss() { [220, 220, 330, 220, 110].forEach((f, i) => setTimeout(() => playTone(f, 0.35, 'sawtooth', 0.35), i * 120)); }

    // ─── PLAYER UPDATE ─────────────────────────────────────────────────────────
    const playerVel = new THREE.Vector3();

    function updatePlayer(delta) {
        if (state.mode !== 'playing') return;

        // Speed power-up modifier
        const speedMult = (state.powerup === 'speed') ? 2.0 : 1.0;
        const speed = (state.isDashing ? C.DASH_SPEED : C.PLAYER_SPEED) * speedMult;
        const inputX = Number(keys['KeyD'] || keys['ArrowRight']) - Number(keys['KeyA'] || keys['ArrowLeft']);
        const inputZ = Number(keys['KeyS'] || keys['ArrowDown']) - Number(keys['KeyW'] || keys['ArrowUp']);

        if (inputX !== 0 || inputZ !== 0) {
            const camFwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw)).normalize();
            const camR = new THREE.Vector3(camFwd.z, 0, -camFwd.x);
            const moveDir = camFwd.multiplyScalar(inputZ).add(camR.multiplyScalar(inputX)).normalize();
            playerVel.copy(moveDir).multiplyScalar(speed);

            const targetAngle = Math.atan2(moveDir.x, moveDir.z);
            player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetAngle, 12 * delta);
        } else {
            playerVel.multiplyScalar(1 - 10 * delta);
        }

        player.position.addScaledVector(playerVel, delta);

        // Arena bounds
        const bound = C.ARENA - 1;
        player.position.x = THREE.MathUtils.clamp(player.position.x, -bound, bound);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -bound, bound);

        // Bob animation
        if (playerVel.length() > 0.5) {
            player.position.y = Math.abs(Math.sin(state.time * 12)) * 0.12;
        } else {
            player.position.y = THREE.MathUtils.lerp(player.position.y, 0, 8 * delta);
        }

        // Dash
        if (state.isDashing) {
            state.dashTimer -= delta;
            if (state.dashTimer <= 0) state.isDashing = false;
        }
        if (state.dashCooldown > 0) state.dashCooldown -= delta;

        // Invincibility blink
        if (state.invincibleTimer > 0) {
            state.invincibleTimer -= delta;
            player.visible = Math.floor(state.time * 12) % 2 === 0;
        } else {
            player.visible = true;
        }

        // Antenna color flash on dash
        const antTip = player.children[player.children.length - 1];
        if (antTip && antTip.material) {
            antTip.material.emissiveIntensity = state.isDashing ? 5 : 3;
            antTip.material.color.set(state.isDashing ? 0xffffff : 0x00ffcc);
        }
    }

    // Dash on click
    document.addEventListener('mousedown', e => {
        if (state.mode === 'playing' && e.button === 0 && state.dashCooldown <= 0 && !state.isDashing) {
            state.isDashing = true;
            state.dashTimer = C.DASH_DURATION;
            state.dashCooldown = C.DASH_COOLDOWN;
            playTone(300, 0.1, 'square', 0.2);
        }
    });

    // ─── ORB UPDATE ────────────────────────────────────────────────────────────
    function updateOrbs(delta) {
        if (state.mode !== 'playing') return;
        for (let i = activeOrbs.length - 1; i >= 0; i--) {
            const orb = activeOrbs[i];
            orb._bobOffset += delta * 2;
            orb.position.y = 1.2 + Math.sin(orb._bobOffset) * 0.3;
            orb._outer.rotation.y += delta * 2;
            orb._inner.rotation.y -= delta * 3;
            orb._outer.rotation.x += delta;

            const dist = player.position.distanceTo(orb.position);
            if (dist < 1.3) {
                // Check if it's a power-up orb
                if (orb._type) {
                    activatePowerup(orb._type);
                    emitParticles(collectParticles, orb.position, 30, 8, orb._color);
                    spawnDamageNumber(orb.position, PU_COLORS[orb._type].label, PU_COLORS[orb._type].color);
                    addShake(0.2);
                    playPowerup();
                    scene.remove(orb);
                    return;
                }
                // Normal orb collect
                emitParticles(collectParticles, orb.position, 25, 7, orb._color);
                spawnDamageNumber(orb.position, `+${C.ORB_SCORE}`, '#ffdd44');
                scene.remove(orb);
                activeOrbs.splice(i, 1);
                state.score += C.ORB_SCORE;
                flashCollect();
                addShake(0.15);
                playCollect();
                updateHUD();

                // Maybe spawn a power-up where this orb was
                const pu = maybeSpawnPowerup(orb.position);

                // Respawn new orb after short delay
                setTimeout(() => {
                    if (state.mode !== 'playing') return;
                    const newOrb = createOrb(Math.floor(Math.random() * C.ORB_COUNT));
                    activeOrbs.push(newOrb);
                }, 2000);
            } else {
                // Animate power-up orbs
                if (orb._type) {
                    orb._bobOffset += delta * 3;
                    orb.position.y = 1.2 + Math.sin(orb._bobOffset) * 0.35;
                    if (orb._ring) orb._ring.rotation.z += delta * 2.5;
                    if (orb._core) orb._core.rotation.y += delta * 3;
                    if (orb._star) { orb._star.rotation.x += delta * 5; orb._star.rotation.z += delta * 4; }
                }
            }
        }
    }

    // ─── ENEMY UPDATE ──────────────────────────────────────────────────────────
    function updateEnemies(delta) {
        if (state.mode !== 'playing') return;
        enemies.forEach(enemy => {
            const spd = state.enemiesFrozen ? 0 : enemy.userData.speed;
            const dir = player.position.clone().sub(enemy.position).normalize();
            enemy.position.addScaledVector(dir, spd * delta);
            enemy.position.y = 0.5 + Math.sin(state.time * 4 + enemy.position.x) * 0.1;
            enemy.rotation.y += state.enemiesFrozen ? 0 : delta * 2;

            // Collision with player
            if (player.position.distanceTo(enemy.position) < 1.2 && state.invincibleTimer <= 0) {
                state.health--;
                state.invincibleTimer = C.INVINCIBLE_TIME;
                emitParticles(damageParticles, player.position, 30, 6, 0xff4444);
                flashDamage();
                addShake(0.4);
                playDamage();
                spawnDamageNumber(player.position, '-1', '#ff4444');
                updateHUD();
                if (state.health <= 0) gameOver();
            }
        });
    }

    function updateBossDamage() {
        if (!state.bossActive) return;
        if (!state.boss) return;
        // Check if player dashes into boss
        if (state.isDashing && player.position.distanceTo(state.boss.position) < 4.0) {
            state.bossHealth--;
            emitParticles(damageParticles, state.boss.position, 20, 5, 0xff6600);
            addShake(0.3);
            playTone(200, 0.15, 'sawtooth', 0.3);
            spawnDamageNumber(state.boss.position, '-1', '#ff6600');
            if (state.bossHealth <= 0) {
                defeatBoss();
                playBossDefeat();
            }
        }
    }

    function startBossWave(waveNum) {
        spawnBoss();
        spawnEnemiesForBoss();
        const bannerText = waveNum === 5 ? '🆂🅱🅾🆂🆂  🆆🅰🆅🅴 🅵🅸🆅🅴!' : `💀 BOSS WAVE ${waveNum}!`;
        showWaveBanner(bannerText);
        playBoss();
    }

    function startNormalWave(waveNum) {
        spawnOrbs();
        spawnEnemies();
        state.health = Math.min(state.health + 1, C.PLAYER_HEALTH);
        updateHUD();
        showWaveBanner(`WAVE ${waveNum}`);
        playWave();
    }

    // ─── WAVE SYSTEM ───────────────────────────────────────────────────────────
    function updateWave(delta) {
        if (state.mode !== 'playing') return;
        if (state.bossActive) return; // Boss waves don't auto-advance
        state.waveTimer += delta;
        if (state.waveTimer >= C.WAVE_DURATION) {
            state.waveTimer = 0;
            state.wave++;
            const isBossWave = state.wave % state.BOSS_WAVE === 0;
            if (isBossWave) {
                startBossWave(state.wave);
            } else {
                startNormalWave(state.wave);
            }
        }
    }

    // ─── DECO ANIMATION ────────────────────────────────────────────────────────
    function updateDeco(delta) {
        decoShapes.forEach(mesh => {
            mesh.userData.bobOffset += delta * mesh.userData.bobSpeed;
            mesh.position.y = 2 + Math.sin(mesh.userData.bobOffset) * 0.8 + 2;
            mesh.rotation.x += delta * mesh.userData.rotSpeed;
            mesh.rotation.y += delta * mesh.userData.rotSpeed * 0.7;
        });
    }

    // ─── ACCENT LIGHTS ANIMATION ───────────────────────────────────────────────
    function updateLights() {
        accentPink.position.x = Math.sin(state.time * 0.3) * 18;
        accentPink.position.z = Math.cos(state.time * 0.3) * 18;
        accentBlue.position.x = Math.cos(state.time * 0.25 + 1) * 18;
        accentBlue.position.z = Math.sin(state.time * 0.25 + 1) * 18;
    }

    // ─── MAIN LOOP ─────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function update(delta) {
        state.time += delta;
        updatePlayer(delta);
        updateOrbs(delta);
        updateEnemies(delta);
        updateBoss(delta);
        updateBossDamage();
        updatePowerups(delta);
        updateWave(delta);
        updateCamera(delta);
        updateDeco(delta);
        updateParticles(collectParticles, delta);
        updateParticles(damageParticles, delta);
        updateDamageNumbers(delta);
        updateLights();
        applyShake();
    }

    function render() {
        composer.render();
    }

    function loop() {
        requestAnimationFrame(loop);
        const delta = Math.min(clock.getDelta(), 0.05);
        update(delta);
        render();
    }

    // ─── EVENT LISTENERS ───────────────────────────────────────────────────────
    document.getElementById('title-screen').addEventListener('click', () => {
        initAudio();
        startGame();
    });

    document.getElementById('gameover-screen').addEventListener('click', () => {
        startGame();
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        fxaaPass.uniforms['resolution'].value.set(1/window.innerWidth, 1/window.innerHeight);
    });

    // ─── KICK OFF ──────────────────────────────────────────────────────────────
    loop();
    </script>
</body>
</html>
